name: Publish Docker Images

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker/Dockerfile.nichebot"
      - "nichebot/**"
      - "app/**"
      - "main.py"
      - "requirements.txt"
      - "docker-compose.nichebot.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  MPT_IMAGE: ghcr.io/${{ github.repository_owner }}/nichebot-mpt
  CLI_IMAGE: ghcr.io/${{ github.repository_owner }}/nichebot

jobs:
  build-mpt:
    name: MPT image (linux/amd64 + arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (arm64 cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push MPT image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.MPT_IMAGE }}:latest
            ${{ env.MPT_IMAGE }}:${{ github.sha }}
          # Override CMD to run the FastAPI server, not Streamlit
          build-args: |
            CMD=python3 main.py
          cache-from: type=gha,scope=mpt
          cache-to: type=gha,mode=max,scope=mpt

  build-nichebot:
    name: nichebot TUI image (linux/amd64 + arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (arm64 cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push nichebot image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.nichebot
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.CLI_IMAGE }}:latest
            ${{ env.CLI_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=nichebot
          cache-to: type=gha,mode=max,scope=nichebot
